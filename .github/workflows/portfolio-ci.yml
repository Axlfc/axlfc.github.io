name: Portfolio checks
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check script.js
      - name: HTML / CSS consistency
        run: |
          test -s index.html
          test -s styles.css
          test -s privacidad.html
  jekyll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build GitHub Pages site
        run: bundle exec jekyll build --trace
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and Playwright
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Browser interaction and responsive checks
        run: python tests/browser_smoke.py
      - name: Preserve visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-captures
          path: browser-artifacts/*.png
          if-no-files-found: warn
          retention-days: 7
