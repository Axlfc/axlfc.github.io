name: Portfolio checks
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check script.js
      - name: HTML / CSS consistency
        run: |
          test -s index.html
          test -s styles.css
          test -s privacidad.html
  jekyll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true
      - name: Build GitHub Pages site
        run: bundle exec jekyll build --trace
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright and use preinstalled Chrome
        run: |
          python -m pip install playwright==1.57.0
          command -v google-chrome
          google-chrome --version
          echo "CHROME_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: Browser interaction and responsive checks
        run: python tests/browser_smoke.py
      - name: Install pinned axe-core for accessibility audit
        run: npm install --prefix /tmp/axlfc-a11y --no-save --no-package-lock axe-core@4.10.3
      - name: Automated WCAG 2.1 A/AA checks (axe-core)
        run: python tests/a11y_axe.py
      - name: Preserve visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-captures
          path: |
            browser-artifacts/*.png
            browser-artifacts/axe-report.json
          if-no-files-found: warn
          retention-days: 7
